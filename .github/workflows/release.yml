name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag; prepare-only verifies current main before this tag exists'
        required: true
        type: string
      prepare_only:
        description: 'Verify the current main release candidate without creating a tag or release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (inputs.prepare_only && 'refs/heads/main') || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version and source
        run: python3 tools/release_version.py check --tag "$RELEASE_TAG"
      - name: Prepare all four verified CI packages
        run: python3 tools/publish_release.py prepare --tag "$RELEASE_TAG" --directory assets/local/release
      - name: Verify draft and publish the player downloads
        if: ${{ !inputs.prepare_only }}
        run: python3 tools/publish_release.py publish --directory assets/local/release
      - name: Preserve publication provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.prepare_only && 'release-preflight' || 'release-publication' }}
          path: |
            assets/local/release/RELEASE-MANIFEST.json
            assets/local/release/SHA256SUMS
            assets/local/release/published.json
          if-no-files-found: warn
          retention-days: 14

  pages:
    needs: publish
    if: ${{ !inputs.prepare_only && !contains(inputs.tag || github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS universal app (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare pinned Mac SDK runtime and original game data
        run: |
          test ! -e assets/local
          test ! -e target
          test ! -e "$RUNNER_TEMP/macos-cargo-home"
          export CARGO_HOME="$RUNNER_TEMP/macos-cargo-home"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo fetch --locked
          python3 tools/macos_package.py prepare-sdl
          python3 tools/reference_assets.py fetch
          python3 tools/reference_assets.py verify
      - name: Test desktop and build both native Mach-O slices
        run: |
          export RUSTFLAGS="-L native=$PWD/assets/local/macos-sdl/install/lib -C link-arg=-Wl,-rpath,@executable_path/../Frameworks"
          export DYLD_LIBRARY_PATH="$PWD/assets/local/macos-sdl/install/lib"
          cargo test -p lemmings-desktop --locked --offline
          cargo build -p lemmings-desktop --release --locked --offline --target aarch64-apple-darwin
          cargo build -p lemmings-desktop --release --locked --offline --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create target/aarch64-apple-darwin/release/lemmings-desktop target/x86_64-apple-darwin/release/lemmings-desktop -output target/universal/OhMyLemmings
          lipo target/universal/OhMyLemmings -verify_arch arm64 x86_64
      - name: Stage and sign the complete test application
        run: |
          python3 tools/macos_package.py stage
          codesign --force --sign - --timestamp=none assets/local/macos-app/OhMyLemmings.app/Contents/Frameworks/libSDL2-2.0.0.dylib
          codesign --force --sign - --timestamp=none assets/local/macos-app/OhMyLemmings.app
          codesign --verify --deep --strict assets/local/macos-app/OhMyLemmings.app
          python3 tools/macos_package.py create
      - name: Verify fresh native Apple Silicon app installation
        run: python3 tools/check_macos_package.py --archive "$(python3 tools/release_version.py path --target macos-universal2)" --expected-arch arm64
      - name: Preserve Mac game and Apple Silicon evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-macos-universal2
          path: |
            assets/local/dist/ohmylemmings-*-macos-universal2.zip*
            assets/local/macos-package-check/*.json
            assets/local/macos-package-check/*.log
            assets/local/macos-package-check/original-fun01.ppm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos-intel:
    name: macOS universal app (Intel)
    needs: macos
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Get exactly the app built and tested on Apple Silicon
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: development-macos-universal2
          path: assets/local/macos-download
      - name: Verify the identical universal package on native Intel
        run: |
          test "$(uname -m)" = x86_64
          python3 tools/check_macos_package.py --archive "$(python3 tools/release_version.py path --target macos-universal2 --directory assets/local/macos-download/dist)" --expected-arch x86_64
      - name: Preserve Intel execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-intel-validation
          path: |
            assets/local/macos-package-check/*.json
            assets/local/macos-package-check/*.log
            assets/local/macos-package-check/original-fun01.ppm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows full game
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONUTF8: '1'
      RUSTFLAGS: '-C target-feature=+crt-static'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare pinned Windows dependencies and game data
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Test-Path assets/local) -or (Test-Path target)) { throw 'Expected clean checkout' }
          $cargoCache = Join-Path $env:RUNNER_TEMP 'full-game-cargo-home'
          if (Test-Path $cargoCache) { throw 'Expected fresh Cargo cache' }
          "CARGO_HOME=$cargoCache" >> $env:GITHUB_ENV
          $env:CARGO_HOME = $cargoCache
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust unavailable' }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Locked fetch failed' }
          python tools/windows_package.py fetch-sdl
          if ($LASTEXITCODE -ne 0) { throw 'SDL verification failed' }
          python tools/reference_assets.py fetch
          if ($LASTEXITCODE -ne 0) { throw 'Original data acquisition failed' }
          python tools/reference_assets.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Original data verification failed' }
      - name: Test and build Windows desktop with static CRT
        run: |
          $ErrorActionPreference = 'Stop'
          $sdlLib = (Resolve-Path assets/local/windows-sdl).Path
          $env:LIB = "$sdlLib;$env:LIB"
          $env:PATH = "$sdlLib;$env:PATH"
          cargo test -p lemmings-desktop --locked --offline
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop tests failed' }
          cargo build -p lemmings-desktop --release --locked --offline
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
      - name: Package original game and verify fresh Windows installation
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/windows_package.py create
          if ($LASTEXITCODE -ne 0) { throw 'Full-game ZIP failed' }
          $archive = python tools/release_version.py path --target windows-x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release version' }
          python tools/check_windows_package.py --archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Windows installation failed' }
      - name: Preserve full Windows game and validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-windows-x86_64
          path: |
            assets/local/dist/ohmylemmings-*-windows-x86_64.zip*
            assets/local/windows-package-check/*.json
            assets/local/windows-package-check/*.log
            assets/local/windows-package-check/original-fun01.ppm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  rust:
    name: Rust native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check clean inputs
        run: |
          test ! -e assets/local
          test ! -e target
          test ! -e "$RUNNER_TEMP/cargo-home"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Prepare SDL2 and locked dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsdl2-dev
          cargo fetch --locked
      - name: Check Rust
        run: make SHELL=python3 ".SHELLFLAGS=tools/performance/ci_shell.py -c" check-rust check-desktop
      - name: Package and install Linux full game
        run: |
          python3 tools/reference_assets.py fetch
          python3 tools/reference_assets.py verify
          make package-linux
      - name: Preserve verified Linux development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-linux-x86_64
          path: |
            assets/local/dist/ohmylemmings-*-linux-x86_64.tar.gz*
            assets/local/linux-package-check/*.json
            assets/local/linux-package-check/*.log
            assets/local/linux-package-check/original-fun01.*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  python:
    name: Python tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check clean inputs
        run: |
          test ! -e assets/local
          test ! -e target
      - name: Check Python tooling
        run: |
          python3 --version
          make check-python

  wasm:
    name: WASM libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check clean inputs
        run: |
          test ! -e assets/local
          test ! -e target
          test ! -e "$RUNNER_TEMP/cargo-home"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain and WASM target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
      - name: Fetch locked dependency metadata
        run: cargo fetch --locked
      - name: Check WASM libraries
        run: make check-wasm

  web:
    name: Web browser
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check clean inputs
        run: |
          test ! -e assets/local
          test ! -e target
          test ! -e "$RUNNER_TEMP/cargo-home"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
      - name: Prepare pinned web build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsdl2-dev
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          cargo fetch --locked
          python3 tools/web_build.py fetch
          google-chrome --version
      - name: Check actual WASM and browser equivalence
        run: make check-web
      - name: Package and install Web full game
        run: |
          python3 tools/reference_assets.py fetch
          python3 tools/reference_assets.py verify
          make package-web
      - name: Preserve verified Web development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-web
          path: |
            assets/local/dist/ohmylemmings-*-web.zip*
            assets/local/web-package-check/*.json
            assets/local/web-package-check/original-fun01.*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

[package]
name = "lemmings-desktop"
description = "SDL2 native adapter for the first DOS Lemmings level"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lemmings-game = { path = "../../crates/lemmings-game" }
lemmings-core = { path = "../../crates/lemmings-core" }
lemmings-resources = { path = "../../crates/lemmings-resources" }
lemmings-session = { path = "../../crates/lemmings-session" }
sdl2 = { version = "=0.38.0", features = ["raw-window-handle"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3"] }

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
lemmings-web = { path = "../web" }

[lints]
workspace = true

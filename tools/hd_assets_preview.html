<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HD 자산 미리보기 · #144</title>
<style>
body{margin:0;background:#142026;color:#e7efea;font:16px system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:32px}h1{font-size:28px;margin:0 0 8px}p{color:#b8c9c1;line-height:1.6}button,select,input{font:inherit}button,select{background:#263b40;color:#fff;border:1px solid #57716a;border-radius:6px;padding:8px 12px}label{display:inline-flex;gap:8px;align-items:center;margin:8px 12px 8px 0}.stage{background:repeating-conic-gradient(#25343c 0 25%,#30424a 0 50%) 0/24px 24px;border:1px solid #557069;border-radius:12px;overflow:hidden;margin:20px 0}canvas{display:block;max-width:100%;height:auto}output{font-variant-numeric:tabular-nums}#frames{display:flex;gap:8px;flex-wrap:wrap}#frames canvas{background:#22363b;border:1px solid #536b68;border-radius:6px}details{margin-top:24px}code{overflow-wrap:anywhere}a{color:#8fe8b5}
</style><main>
<h1>새 HD 캐릭터와 암석</h1>
<p>걷기 좌우 각 8프레임과 분리된 암석 재질의 제작 미리보기입니다. 실제 게임의 HD 모드는 다음 통합 단계에서 연결합니다.</p>
<label>방향 <select id="direction"><option value="0">오른쪽</option><option value="2">왼쪽</option></select></label>
<button id="play">일시정지</button>
<label>프레임 <input id="frame" type="range" min="0" max="7" value="0"><output id="number">0</output></label>
<label>배경 <select id="background"><option value="checker">투명도 확인</option><option value="dark">어두운 동굴</option><option value="light">밝은 바탕</option></select></label>
<div class="stage"><canvas id="stage" width="1000" height="320"></canvas></div>
<p>왼쪽은 HD 게임에서 사용할 크기, 오른쪽은 3배 확인용입니다. 선은 모든 프레임에 같은 발 위치를 표시합니다. 암석의 외곽은 미리보기용 도형이며 게임 충돌 지형이 아닙니다.</p>
<div id="frames"></div>
<details><summary>제작 범위와 확인 사항</summary><p id="details"></p><p>암석 반복 경계와 실제 HD 합성에서의 보행·색 번짐 품질은 후속 검토 대상입니다. 원본 게임의 틱·움직임·충돌 규칙을 이 페이지로 검증하지 않습니다.</p></details>
<p id="status" role="status">자산을 불러오는 중…</p>
</main>
<script type="module">
const $=id=>document.getElementById(id);
try {
 const response=await fetch('manifest.json');if(!response.ok)throw Error('manifest '+response.status);
 const manifest=await response.json();
 const images=await Promise.all(manifest.atlases.map(async entry=>{const image=new Image();image.src=entry.path;await image.decode();if(!entry.alpha_cutoff)return image;const texture=document.createElement('canvas');texture.width=image.width;texture.height=image.height;const context=texture.getContext('2d',{willReadFrequently:true});context.drawImage(image,0,0);const pixels=context.getImageData(0,0,image.width,image.height);for(let i=3;i<pixels.data.length;i+=4)if(pixels.data[i]<=entry.alpha_cutoff)pixels.data[i]=0;context.putImageData(pixels,0,0);return texture;}));
 const actor=(slot,index)=>manifest.frames.find(f=>f.key.actor?.[0]===slot&&f.key.actor?.[1]===index);
 const rock=manifest.frames.find(f=>f.key.material===0);
 let playing=true;let index=0;let last=-1;let lastSlot=-1;
 function drawSprite(context,frame,x,y,scale=1){const [sx,sy,sw,sh]=frame.rect;const [w,h]=frame.display;const [ax,ay]=frame.anchor;context.drawImage(images[frame.atlas],sx,sy,sw,sh,x-ax*scale,y-ay*scale,w*scale,h*scale);}
 function draw(){
  const slot=Number($('direction').value),canvas=$('stage'),c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);
  const bg=$('background').value;if(bg!=='checker'){c.fillStyle=bg==='light'?'#f4eee0':'#111c25';c.fillRect(0,0,1000,320);}
  const sprite=actor(slot,index);if(!sprite)throw Error('missing actor frame');
  c.fillStyle=c.createPattern(images[rock.atlas],'repeat');
  c.save();c.translate(0,245);c.scale(.25,.25);c.fillRect(0,0,4000,300);c.restore();
  c.strokeStyle='#92dab1';c.lineWidth=1;c.beginPath();c.moveTo(40,244.5);c.lineTo(960,244.5);c.stroke();
  drawSprite(c,sprite,230,244);drawSprite(c,sprite,700,244,3);
  c.fillStyle=bg==='light'?'#142026':'#d7e9e1';c.font='16px system-ui';c.fillText('HD 크기',195,42);c.fillText('3× 확대',665,42);
  $('number').value=String(index);$('frame').value=String(index);
  if(lastSlot!==slot){$('frames').replaceChildren();for(let i=0;i<8;i++){const thumb=document.createElement('canvas');thumb.width=112;thumb.height=88;thumb.setAttribute('aria-label','frame '+i);const tc=thumb.getContext('2d');drawSprite(tc,actor(slot,i),56,68);tc.fillStyle='#c9ddd5';tc.font='12px system-ui';tc.fillText(String(i),6,16);$('frames').append(thumb);}lastSlot=slot;}
 }
 $('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'일시정지':'재생';};
 $('frame').oninput=()=>{playing=false;$('play').textContent='재생';index=Number($('frame').value);draw();};
 $('direction').onchange=draw;$('background').onchange=draw;
 $('details').textContent=`PNG ${manifest.atlases[0].width}×${manifest.atlases[0].height}, 걷기 slot0/2·각8프레임. RGB/alpha 원본 유지, 프레임별 사각형·표시 크기·발 기준점 사용.`;
 $('status').textContent='17개 자산을 불러왔습니다. 걷기 속도 8fps는 제작 검토용이며 실제 게임의 재생 타이밍이 아닙니다.';
 function animate(time){if(playing){const tick=Math.floor(time/125);if(tick!==last){index=tick%8;last=tick;draw();}}requestAnimationFrame(animate);}draw();requestAnimationFrame(animate);
}catch(error){$('status').textContent='불러오기 실패: '+error.message;throw error;}
</script></html>
